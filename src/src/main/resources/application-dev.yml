spring:
  datasource:
    url: jdbc:mysql://localhost:3306/user_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: WJ28@krhps
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' is acceptable for local development only.
      # Production (Phase 37+) will use a safer strategy (validate + migrations),
      # since 'update' can silently apply unintended schema changes.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false   # disabled deliberately: prevents lazy-loading DB calls during view rendering, avoids hidden N+1 issues later

logging:
  level:
    com.example.ticketbooking: DEBUG
    org.hibernate.SQL: DEBUG